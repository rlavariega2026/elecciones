name: Deploy Elecciones to lavdigitalagency.com
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elecciones-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: TypeScript check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Include PHP API and Apache rules
        run: |
          mkdir -p dist/api
          cp deploy/.htaccess dist/.htaccess
          cp deploy/api/.htaccess dist/api/.htaccess
          cp deploy/api/index.php dist/api/index.php
          cp deploy/manifest.webmanifest dist/manifest.webmanifest
          cp deploy/logo-lav.svg dist/logo-lav.svg
      - name: Diagnose actual FTP root and verify target
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
        run: |
          python3 - <<'PY'
          import ftplib,os
          ftp=ftplib.FTP()
          ftp.connect(os.environ['FTP_SERVER'].removeprefix('ftp://'),int(os.environ['FTP_PORT']),timeout=25)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          print('FTP login root:',ftp.pwd())
          print('FTP root entries:',ftp.nlst()[:50])
          for p in ['/elecciones','/public_html/elecciones','/domains/lavdigitalagency.com/public_html/elecciones']:
            try:
              ftp.cwd(p)
              print('EXISTS',p,'entries:',ftp.nlst()[:25])
              ftp.cwd('/')
            except ftplib.all_errors as e:
              print('NOT ACCESSIBLE',p,str(e)[:140]);ftp.cwd('/')
          ftp.quit()
          PY
      - name: Deploy to actual domain document root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || '21' }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /domains/lavdigitalagency.com/public_html/elecciones/
          dangerous-clean-slate: false

      - name: Verify deployed index in actual domain directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
        run: |
          python3 - <<'PY'
          import ftplib,os
          f=ftplib.FTP()
          f.connect(os.environ['FTP_SERVER'].removeprefix('ftp://'),int(os.environ['FTP_PORT']),timeout=25)
          f.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          target='/domains/lavdigitalagency.com/public_html/elecciones/'
          f.cwd(target)
          names=f.nlst()
          print('Verified target:',target,'files:',names)
          if 'index.html' not in [x.rsplit('/',1)[-1] for x in names]:
              raise SystemExit('DEPLOYMENT FAILED: index.html absent from domain target')
          f.quit()
          PY
